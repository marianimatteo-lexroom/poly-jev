[project]
name = "poly-jev"
version = "0.1.0"
description = "Reflex: a short-horizon yes/no trading agent for Polymarket, powered by TypeSafe AI's Jev system-one model."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "typesafe-sdk>=0.7,<1.0",
]

[project.optional-dependencies]
# Verified installable and working (build+sign a real approval tx, real
# ClobClient order-construction calls) against py-clob-client==0.34.6 and
# web3==8.0.0 while building this harness.
live = ["py-clob-client>=0.34,<0.35", "web3>=8.0,<9"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reflex"]
