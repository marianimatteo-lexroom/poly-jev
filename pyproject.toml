[project]
name = "poly-jev"
version = "0.1.0"
description = "Reflex: a short-horizon yes/no trading agent for Polymarket, powered by TypeSafe AI's Jev system-one model."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "typesafe-sdk>=0.7,<1.0",
]

[project.optional-dependencies]
# polymarket-client is Polymarket's current official SDK — it replaced
# py-clob-client, which targets contracts/collateral (USDC.e direct) that
# Polymarket's own docs now list as deprecated (see executor.py). web3 is
# kept for the read-only pUSD/MATIC balance check in onboarding.py.
live = ["polymarket-client>=0.10,<0.11", "web3<9"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reflex"]
